[project]
name = "correspondence-backend"
version = "1.0.0"
description = "Информационная система для учета входящей корреспонденции организации (backend)"
requires-python = ">=3.14"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]   # Depends()/Query() в значениях по умолчанию — штатный паттерн FastAPI

[tool.ruff.lint.isort]
# каталог alembic/ в корне не должен определяться как first-party пакет
known-third-party = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra"
